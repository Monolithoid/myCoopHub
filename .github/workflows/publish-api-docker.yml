name: Publish API Docker image

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/coolify-api
  # Docker Hub short description: 100 bytes max.
  SHORT_DESCRIPTION: "Web app, REST API and Discord bot to start/stop co-op game servers on Coolify"

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker metadata (OCI labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          labels: |
            org.opencontainers.image.title=myCoopHub
            org.opencontainers.image.description=${{ env.SHORT_DESCRIPTION }}
            org.opencontainers.image.documentation=${{ github.server_url }}/${{ github.repository }}#readme

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE_NAME }}:buildcache,mode=max

      - name: Compose Docker Hub overview
        if: github.ref == 'refs/heads/main'
        env:
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
          RAW_URL: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}
        shell: bash
        run: |
          # Docker Hub cannot resolve the README's relative paths: images point to the
          # raw file of this commit, other links to the file on GitHub.
          python3 - README.md "$RUNNER_TEMP/dockerhub-README.md" <<'PY'
          import os, re, sys
          src, dst = sys.argv[1], sys.argv[2]
          repo, raw, ref = os.environ["REPO_URL"], os.environ["RAW_URL"], os.environ["GITHUB_REF_NAME"]
          text = open(src, encoding="utf-8").read()
          def absolute(path):
              path = path[2:] if path.startswith("./") else path
              if re.search(r"\.(png|jpe?g|gif|svg|webp)$", path.split("#")[0], re.I):
                  return f"{raw}/{path}"
              return f"{repo}/blob/{ref}/{path}"
          relative = r"(?!https?://|mailto:|#|/)([^)\"\s]+)"
          text = re.sub(r"(\]\()" + relative, lambda m: m.group(1) + absolute(m.group(2)), text)
          text = re.sub(r"(src=\")" + relative, lambda m: m.group(1) + absolute(m.group(2)), text)
          text += (
              "\n\n---\n\n## Links\n\n"
              f"- Source code and documentation: [{os.environ['GITHUB_REPOSITORY']}]({repo})\n"
              f"- Dockerfile: [Dockerfile]({repo}/blob/{ref}/Dockerfile)\n"
              f"- Example Compose file: [docker-compose.example.yml]({repo}/blob/{ref}/docker-compose.example.yml)\n"
              f"- Issues and suggestions: [GitHub issues]({repo}/issues)\n"
          )
          open(dst, "w", encoding="utf-8").write(text)
          PY

      - name: Update Docker Hub description
        if: github.ref == 'refs/heads/main'
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ env.IMAGE_NAME }}
          short-description: ${{ env.SHORT_DESCRIPTION }}
          readme-filepath: ${{ runner.temp }}/dockerhub-README.md
